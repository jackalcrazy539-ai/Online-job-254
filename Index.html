<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>DiasporaConnect Jobs</title>
</head>
<body>
    <div class="chat-container">
        <header>
            <h3>Global Talent Chat</h3>
            <span class="status">Online: 428 Experts</span>
        </header>
        <div id="chat-window">
            <div class="message received"><strong>Employer:</strong> Hi! I saw your profile in our London-based pool. Are you open to a remote technical lead role?</div>
            <div class="message sent"><strong>You:</strong> Hi! Yes, I am. I'm currently based in Nairobi and have 5 years of experience in distributed systems.</div>
        </div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
